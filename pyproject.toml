[project]
name = "searches"
version = "0.1.0"
description = "State-space search algorithms and reproducible teaching comparisons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9", "rich>=13.9"]

[project.scripts]
searches = "searches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
